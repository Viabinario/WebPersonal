# Build y subida a docs/ (GitHub Pages solo permite / o /docs en el desplegable)
# Settings → Pages: Deploy from a branch → Branch = fsanchez → Folder = /docs
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - fsanchez
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_CONTACT_API_URL: ${{ vars.VITE_CONTACT_API_URL || '' }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL || '' }}

      - name: Copiar dist/ a docs/ (GitHub Pages requiere /docs)
        run: |
          rm -rf docs
          mkdir -p docs
          cp -r dist/. docs/
          touch docs/.nojekyll

      - name: Subir docs/ a la rama fsanchez
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Deploy: actualizar docs/ con build de Vite"
          git push origin fsanchez
