# Build y subida del contenido de dist/ a la rama gh-pages.
# Así puedes seguir usando: Settings → Pages → Source = "Deploy from a branch" → rama gh-pages, carpeta / (root).
# La rama gh-pages solo contiene el sitio construido (index.html + assets/), no el código fuente.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - fsanchez
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_CONTACT_API_URL: ${{ vars.VITE_CONTACT_API_URL || '' }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL || '' }}

      - name: Deploy to branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
