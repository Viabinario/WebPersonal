# Build y subida de dist/ a la rama fsanchez. dist/ está en .gitignore, se fuerza su inclusión en el commit.
# Settings → Pages: Deploy from a branch → Branch = fsanchez → Folder = /dist
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - fsanchez
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_CONTACT_API_URL: ${{ vars.VITE_CONTACT_API_URL || '' }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL || '' }}

      - name: Asegurar .nojekyll
        run: touch dist/.nojekyll

      - name: Subir dist/ a la rama fsanchez
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          git diff --staged --quiet || git commit -m "Deploy: actualizar dist/ con build de Vite"
          git push origin fsanchez
