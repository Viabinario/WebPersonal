# Build y subida a docs/ de la rama fsanchez (GitHub Pages requiere / o /docs)
# Settings → Pages: Deploy from a branch → Branch = fsanchez → Folder = /docs
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - fsanchez
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Si las variables están en un entorno (Settings → Environments), descomenta y usa su nombre:
    # environment: production
    env:
      GITHUB_PAGES: 'true'
      # Variables y Secrets: mismo nombre en Settings → Secrets and variables → Actions (Variables o Secrets)
      VITE_CONTACT_API_URL: ${{ vars.VITE_CONTACT_API_URL || secrets.VITE_CONTACT_API_URL }}
      VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL || secrets.VITE_CONTACT_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verificar variables del formulario de contacto
        run: |
          if [ -z "$VITE_CONTACT_API_URL" ] || [ "${#VITE_CONTACT_API_URL}" -lt 10 ]; then
            echo "::error::VITE_CONTACT_API_URL no está disponible en este build."
            echo "Configura la variable (o el secret) en GitHub: Settings → Secrets and variables → Actions → Variables (o Secrets)."
            echo "Si la variable está en un Environment, añade 'environment: nombre-del-env' al job en deploy-gh-pages.yml."
            exit 1
          fi
          echo "VITE_CONTACT_API_URL está configurada (longitud OK)."

      - name: Build
        run: npm run build

      - name: Preparar docs/ con CNAME y .nojekyll
        run: |
          # Limpiar docs/ existente para evitar conflictos
          rm -rf docs
          mkdir -p docs
          # Copiar build fresco
          cp -r dist/. docs/
          # Añadir archivos necesarios para GitHub Pages
          echo "fsanchez.suroesteintegral.com" > docs/CNAME
          touch docs/.nojekyll

      - name: Subir docs/ a fsanchez
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Añadir todos los archivos de docs/
          git add docs/
          # FORZAR add de archivos JS (porque .gitignore los bloquea)
          git add -f docs/assets/*.js || true
          # Commitear solo si hay cambios
          if ! git diff --staged --quiet; then
            git commit -m "Deploy: actualizar docs/ con build y CNAME"
            git push origin fsanchez
          else
            echo "✓ No hay cambios en docs/, skip commit"
          fi
