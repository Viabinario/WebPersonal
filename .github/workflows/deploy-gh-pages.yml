# Build y subida a docs/ de la rama fsanchez (GitHub Pages requiere / o /docs)
# Settings → Pages: Deploy from a branch → Branch = fsanchez → Folder = /docs
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - fsanchez
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_CONTACT_API_URL: ${{ vars.VITE_CONTACT_API_URL || '' }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL || '' }}

      - name: Preparar docs/ con CNAME y .nojekyll
        run: |
          # Limpiar docs/ existente para evitar conflictos
          rm -rf docs
          mkdir -p docs
          # Copiar build fresco
          cp -r dist/. docs/
          # Añadir archivos necesarios para GitHub Pages
          echo "fsanchez.suroesteintegral.com" > docs/CNAME
          touch docs/.nojekyll

      - name: Subir docs/ a fsanchez
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Añadir todos los archivos de docs/
          git add docs/
          # FORZAR add de archivos JS (porque .gitignore los bloquea)
          git add -f docs/assets/*.js || true
          # Commitear solo si hay cambios
          if ! git diff --staged --quiet; then
            git commit -m "Deploy: actualizar docs/ con build y CNAME"
            git push origin fsanchez
          else
            echo "✓ No hay cambios en docs/, skip commit"
          fi
