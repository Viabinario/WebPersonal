# Build y despliegue a rama gh-pages (solo contenido compilado, sin código fuente)
# Settings → Pages: Deploy from a branch → Branch = gh-pages → Folder = / (root)
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - fsanchez
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_CONTACT_API_URL: ${{ vars.VITE_CONTACT_API_URL || '' }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL || '' }}

      - name: Asegurar CNAME y .nojekyll
        run: |
          echo "fsanchez.suroesteintegral.com" > dist/CNAME
          touch dist/.nojekyll

      - name: Deploy a gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          cname: fsanchez.suroesteintegral.com
